manifestVersion: 1
id: deepdance-bitcoin-sv
category: bitcoin
name: Bitcoin SV Full Node (DeepDance)
version: "1.2.0"
tagline: Sauberer arm64 Bitcoin-SV-Full-Node fuer Raspberry Pi 5
description: >-
  Ein aus dem offiziellen Quellcode gebauter Bitcoin-SV-Node speziell fuer
  64-bit ARM Hardware (Raspberry Pi 5, 5tratumOS). Kein amd64-Image, keine
  QEMU-Emulation, keine fragile Berkeley-DB-Installation von Hand - alles ist
  im Image sauber vorkompiliert.

  Enthaelt Wallet-Unterstuetzung (fuer Empfangsadresse, Guthaben und
  Mining-Belohnungen im BSV Solo Mining Dashboard), ZMQ-Benachrichtigungen
  fuer neue Bloecke sowie txindex fuer volle RPC-Kompatibilitaet.

  Empfehlung: externe SSD statt microSD-Karte fuer die Blockchain-Daten.
