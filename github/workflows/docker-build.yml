name: Docker Images bauen und veroeffentlichen

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: deepdance1977

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bsv-solo-mining-dashboard-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bsv-solo-mining-dashboard-backend:${{ github.ref_name }}

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bsv-solo-mining-dashboard-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bsv-solo-mining-dashboard-frontend:${{ github.ref_name }}

  build-node:
    runs-on: [self-hosted, linux, arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build und Push (nativ arm64)
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.OWNER }}/bsv-full-node-arm64:1.2.0 \
                       -t ${{ env.REGISTRY }}/${{ env.OWNER }}/bsv-full-node-arm64:latest \
                       ./node
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/bsv-full-node-arm64:1.2.0
          docker push ${{ env.REGISTRY }}/${{ env.OWNER }}/bsv-full-node-arm64:latest
